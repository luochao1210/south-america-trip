<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>南美旅行手册 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF6F1;--bg2:#FFFFFF;--bg3:#F0EBE4;
  --tx1:#1A1A1A;--tx2:#666;--tx3:#999;
  --pri:#E07A5F;--pri-l:#FDEEE9;--sec:#3D405B;
  --ok:#81B29A;--warn:#F2CC8F;--danger:#E07A5F;
  --brd:#E8E0D8;--sh:rgba(0,0,0,.06);
  --r:14px;--rs:8px;
}
html.dark{
  --bg:#121220;--bg2:#1C1C30;--bg3:#252540;
  --tx1:#E4E4EE;--tx2:#A0A0B8;--tx3:#6A6A80;
  --pri:#F4845F;--pri-l:#2D2040;--sec:#C8C8E0;
  --ok:#8BC6A0;--warn:#F4D890;--danger:#F4845F;
  --brd:#2E2E48;--sh:rgba(0,0,0,.2);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg2);color:var(--tx1);
  line-height:1.6;min-height:100vh;
  padding-bottom:0;
}
.container{max-width:680px;margin:0 auto;padding:0 16px}

/* ===== Hero ===== */
.hero{
  background:linear-gradient(135deg,#3D405B 0%,#E07A5F 100%);
  color:#fff;padding:28px 20px 24px;border-radius:0 0 24px 24px;
  margin-bottom:20px;position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;top:-40%;right:-20%;
  width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none;
}
.hero-label{
  font-size:13px;font-weight:700;opacity:1;
  text-transform:uppercase;letter-spacing:3px;margin-bottom:6px;
  text-shadow:0 1px 3px rgba(0,0,0,.2);
}
.hero-title{font-size:24px;font-weight:700;margin-bottom:2px}
.hero-detail{font-size:14px;opacity:.8;margin-bottom:20px}
.countdown{display:flex;justify-content:center;gap:10px;position:relative;z-index:1}
.cd-unit{text-align:center;min-width:56px}
.cd-num{
  font-size:36px;font-weight:800;line-height:1;
  font-family:"SF Mono","Cascadia Code","Fira Code",monospace;
  background:rgba(255,255,255,.15);backdrop-filter:blur(4px);
  border-radius:10px;padding:8px 10px;display:block;
}
.cd-lbl{font-size:11px;opacity:.7;margin-top:4px;display:block}
.hero-tz{font-size:12px;opacity:.6;text-align:center;margin-top:10px}

/* Hero todos */
.hero-todo{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);position:relative;z-index:1}
.hero-todo-title{
  font-size:13px;font-weight:700;margin-bottom:8px;
  display:inline-block;
  background:var(--danger);color:#fff;
  padding:4px 14px;border-radius:20px;
  box-shadow:0 2px 6px rgba(224,122,95,.3);
}
.hero-todo-list{display:flex;flex-direction:column;gap:6px}
.hero-todo-item{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:500;opacity:1;
  background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.hero-todo-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
.hero-todo-dot.urgent{background:#F4845F}
.hero-todo-dot.normal{background:#F4D890}
.hero-todo-dot.low{background:#8BC6A0}
.hero-todo-text{
  flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hero-todo-link{
  display:block;text-align:center;margin-top:10px;
  font-size:12px;opacity:.7;color:#fff;text-decoration:none;
  padding:4px 0;border-radius:4px;
  background:rgba(255,255,255,.1);
}
.hero-todo-link:active{opacity:1}

/* Quick Nav */
.quick-nav{
  position:sticky;top:0;z-index:100;
  background:var(--bg2);border-bottom:1px solid var(--brd);
  padding:8px 0;margin-bottom:16px;
  box-shadow:0 2px 8px var(--sh);
}
.quick-nav-inner{
  display:flex;gap:4px;padding:0 12px;
  justify-content:center;flex-wrap:wrap;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.quick-nav-inner::-webkit-scrollbar{display:none}
.qn-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:999px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;
  background:transparent;color:var(--tx2);transition:background .15s;
  flex:1;min-width:0;
}
.qn-btn .qn-icon{font-size:18px;line-height:1}
.qn-btn:active{background:var(--bg3)}
.qn-btn.active{background:var(--bg3);color:var(--tx1)}

/* Trip Intro */
.trip-intro{
  text-align:center;padding:24px 20px;margin:0 16px 20px;
  background:linear-gradient(135deg,var(--pri-l) 0%,var(--bg2) 100%);
  border:1px solid var(--brd);border-radius:var(--r);
  box-shadow:0 2px 8px var(--sh);
}
.trip-intro-quote{
  font-size:18px;font-weight:700;color:var(--pri);
  line-height:1.6;margin-bottom:8px;
}
.trip-intro-crew{
  font-size:13px;color:var(--tx2);font-weight:600;letter-spacing:2px;
}

/* Animated Avatars */
.avatar-row{
  display:flex;justify-content:center;gap:20px;margin-top:16px;
}
.avatar{
  display:flex;flex-direction:column;align-items:center;
  animation:bounce 2s ease-in-out infinite;
}
.avatar:nth-child(1){animation-delay:0s}
.avatar:nth-child(2){animation-delay:.3s}
.avatar:nth-child(3){animation-delay:.6s}
.avatar:nth-child(4){animation-delay:.9s}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.avatar svg{
  width:60px;height:60px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.1));
}
.avatar-name{
  font-size:12px;color:var(--tx2);text-align:center;margin-top:4px;font-weight:600;
}
/* Bottom Nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;z-index:100;
  background:var(--bg2);
  box-shadow:0 -2px 10px var(--sh);
  padding:12px 12px 0;
  padding-bottom:env(safe-area-inset-bottom);
  margin:0;
  border-radius:0;
}
.bottom-nav-inner{
  display:flex;justify-content:center;gap:2px;
  max-width:680px;margin:0 auto;
  padding:4px 6px;
  background:var(--bg2);border:1px solid var(--brd);border-radius:20px;
  box-shadow:0 2px 8px var(--sh);
}

/* ===== Section ===== */
.section{margin-bottom:24px}
.section-title{
  font-size:18px;font-weight:700;padding:0 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.section-title .icon{font-size:20px}

/* Scope tabs (confirmed / unbooked) */
.scope-tabs{
  display:flex;gap:6px;padding:0 16px;margin-bottom:12px;
}
.scope-tab{
  flex:1;padding:10px 14px;border-radius:20px;font-size:14px;font-weight:700;
  cursor:pointer;border:none;text-align:center;
  background:var(--bg3);color:var(--tx2);transition:all .2s;
}
.scope-tab.active{background:var(--pri);color:#fff}
.sub-header{
  font-size:13px;font-weight:600;color:var(--tx2);
  padding:8px 0 4px;border-bottom:1px solid var(--brd);margin-bottom:8px;
}

/* ===== Tabs ===== */
.tabs{
  display:flex;gap:6px;padding:0 16px;margin-bottom:12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  white-space:nowrap;cursor:pointer;border:none;
  background:var(--bg3);color:var(--tx2);transition:all .2s;
}
.tab.active{background:var(--pri);color:#fff}
.tab-panel{display:none;padding:0 16px}
.tab-panel.active{display:block}

/* ===== Cards ===== */
.card{
  background:var(--bg2);border-radius:var(--r);
  box-shadow:0 2px 8px var(--sh);border:1px solid var(--brd);
  margin-bottom:12px;overflow:hidden;transition:transform .15s;
}
.card:active{transform:scale(.98)}

/* Flight card */
.flight{padding:16px}
.flight-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.flight-no{font-weight:700;font-size:15px}
.flight-tag{
  font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;
}
.tag-ok{background:rgba(129,178,154,.15);color:var(--ok)}
.tag-tbd{background:rgba(242,204,143,.2);color:#C89630}
.flight-route{display:flex;align-items:center;gap:10px}
.flight-city{flex:1}
.flight-city.left{text-align:left}
.flight-city.right{text-align:right}
.flight-time{font-size:28px;font-weight:800;font-family:"SF Mono",monospace;line-height:1}
.flight-code{font-size:13px;color:var(--tx2);font-weight:600;margin-top:2px}
.flight-date{
  font-size:13px;font-weight:700;color:var(--pri);margin-top:4px;
  background:var(--pri-l);padding:2px 8px;border-radius:6px;
  display:inline-block;
}
.flight-mid{
  display:flex;flex-direction:column;align-items:center;
  color:var(--tx3);min-width:60px;flex-shrink:0;
}
.flight-dur{font-size:11px;margin-bottom:2px}
.flight-line{width:100%;height:1px;background:var(--brd);position:relative}
.flight-line::before{content:'✈';position:absolute;right:-2px;top:-8px;font-size:12px}
.flight-note{font-size:12px;color:var(--tx3);margin-top:10px;padding-top:8px;border-top:1px solid var(--brd)}

/* Accommodation / generic card */
.info-card{padding:14px 16px}
.info-card .ic-title{font-weight:600;font-size:14px;margin-bottom:4px}
.info-card .ic-sub{font-size:13px;color:var(--tx2)}
.info-card .ic-empty{color:var(--tx3);font-style:italic;font-size:13px}

/* ===== Map ===== */
.map-wrap{
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--brd);padding:12px;margin:0 16px 12px;
  box-shadow:0 2px 8px var(--sh);overflow:hidden;
}
.map-wrap svg{width:100%;height:auto;display:block}
.map-legend{
  display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 0;
  font-size:11px;color:var(--tx2);
}
.map-legend span{display:flex;align-items:center;gap:4px}
.map-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* Route summary */
.route-summary{padding:12px 0 0;border-top:1px solid var(--brd);margin-top:12px}
.route-group{
  display:flex;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--brd);
}
.route-group:last-child{border-bottom:none}
.route-bar{width:4px;border-radius:2px;flex-shrink:0;min-height:100%}
.route-days{font-size:11px;font-weight:700;color:var(--tx3);white-space:nowrap;min-width:42px;padding-top:2px}
.route-detail{font-size:13px;color:var(--tx1);line-height:1.5}

/* Timeline stops */
.route-header{
  font-size:14px;font-weight:700;color:var(--pri);
  text-align:center;margin:16px 0 12px;
}
.timeline-wrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:0 0 10px;margin-bottom:8px;
  border-bottom:1px solid var(--brd);
}
.timeline-wrap::-webkit-scrollbar{display:none}
.timeline{
  display:flex;align-items:flex-start;
  position:relative;min-width:max-content;
  padding:0 12px;
}
.timeline::before{
  content:'';position:absolute;top:6px;
  left:24px;right:24px;height:2px;
  background:var(--brd);border-radius:1px;
}
.tl-stop{
  display:flex;flex-direction:column;align-items:center;
  min-width:60px;position:relative;padding:0 4px;
}
.tl-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--pri);border:3px solid var(--bg2);
  box-shadow:0 0 0 2px var(--pri);
  position:relative;z-index:1;flex-shrink:0;
}
.tl-loc{
  font-size:12px;font-weight:700;color:var(--tx1);
  margin-top:8px;white-space:nowrap;text-align:center;
}
.tl-date{
  font-size:10px;color:var(--tx3);margin-top:2px;white-space:nowrap;
}

/* ===== Itinerary ===== */
.day-card{
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--brd);margin:0 16px 12px;
  box-shadow:0 2px 8px var(--sh);overflow:hidden;
}
.day-head{
  display:flex;align-items:center;padding:14px 16px;
  cursor:pointer;user-select:none;gap:10px;
}
.day-num{
  font-size:12px;font-weight:700;color:#fff;
  background:var(--pri);border-radius:6px;
  padding:2px 8px;flex-shrink:0;
}
.day-date{font-weight:700;font-size:15px;flex:1}
.day-arrow{
  font-size:12px;color:var(--tx3);transition:transform .25s;flex-shrink:0;
}
.day-card.open .day-arrow{transform:rotate(180deg)}
.day-body{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
}
.day-card.open .day-body{max-height:2000px}
.day-summary{
  font-size:13px;color:var(--tx2);padding:0 16px 12px;
  line-height:1.5;
}
.day-summary-text{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.day-inner{padding:0 16px 16px}

/* Timeline */
.tl{position:relative;padding-left:76px}
.tl::before{
  content:'';position:absolute;left:65px;top:4px;bottom:4px;
  width:2px;background:var(--brd);border-radius:1px;
}
.tl-item{
  position:relative;margin-bottom:16px;
  display:flex;align-items:flex-start;
}
.tl-item:last-child{margin-bottom:0}
.tl-time{
  position:relative;left:-76px;
  width:60px;flex-shrink:0;
  text-align:right;font-size:13px;font-weight:700;
  font-family:"SF Mono",monospace;color:var(--pri);
  white-space:nowrap;padding-right:8px;
}
.tl-dot{
  position:relative;left:-16px;top:4px;width:10px;height:10px;
  flex-shrink:0;border-radius:50%;border:2px solid var(--pri);background:var(--bg2);
}
.tl-dot.hotel{border-color:var(--sec);background:var(--sec)}
.tl-dot.done{border-color:var(--ok);background:var(--ok)}
.tl-content{font-size:14px;line-height:1.5}
.tl-content .loc-link{
  color:var(--pri);text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:2px;cursor:pointer;
}
.tl-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.tl-badge{
  display:inline-block;font-size:11px;font-weight:600;
  padding:1px 6px;border-radius:4px;margin-left:4px;
}
.badge-ticket{background:rgba(129,178,154,.15);color:var(--ok)}
.badge-book{background:rgba(242,204,143,.2);color:#C89630}
.badge-group{background:rgba(61,64,91,.12);color:var(--sec)}
.day-nav{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--brd);
  display:flex;gap:8px;flex-wrap:wrap;
}
.nav-btn{
  font-size:12px;padding:6px 12px;border-radius:6px;
  background:var(--pri-l);color:var(--pri);border:1px solid var(--pri);
  cursor:pointer;text-decoration:none;font-weight:600;
}
.nav-btn:active{opacity:.7}

/* ===== Todo ===== */
.todo-list{padding:0 16px}
.todo-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--bg2);
  border:1px solid var(--brd);border-radius:var(--rs);
  margin-bottom:8px;font-size:14px;
  cursor:pointer;user-select:none;transition:opacity .2s;
}
.todo-item.done{opacity:.4}
.todo-item.done span:last-child{text-decoration:line-through;color:var(--tx3)}
.todo-check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--brd);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:transparent;cursor:pointer;transition:all .15s;
}
.todo-item.done .todo-check{background:var(--ok);border-color:var(--ok);color:#fff}
.todo-add-row{
  display:flex;gap:6px;padding:0 16px;margin-top:8px;
}
.todo-add-input{
  flex:1;padding:8px 10px;border:1px solid var(--brd);border-radius:8px;
  font-size:13px;background:var(--bg2);color:var(--tx1);
}
.todo-add-btn{
  padding:8px 14px;border:none;border-radius:8px;
  background:var(--pri);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
}
.todo-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.todo-dot.urgent{background:var(--danger)}
.todo-dot.normal{background:var(--warn)}
.todo-dot.low{background:var(--ok)}

/* ===== Shopping ===== */
.shop-list{padding:0 16px}
.shop-item{
  display:flex;align-items:center;padding:10px 14px;
  background:var(--bg2);border:1px solid var(--brd);
  border-radius:var(--rs);margin-bottom:8px;font-size:14px;
  cursor:pointer;user-select:none;transition:opacity .2s;
}
.shop-item.checked{opacity:.5}
.shop-item.checked .shop-name{text-decoration:line-through;color:var(--tx3)}
.shop-name{flex:1}
.shop-cat{font-size:11px;color:var(--tx3);margin-right:8px}
.shop-check{
  width:22px;height:22px;border-radius:6px;
  border:2px solid var(--brd);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-size:14px;color:transparent;
}
.shop-item.checked .shop-check{
  background:var(--ok);border-color:var(--ok);color:#fff;
}
.shop-card{
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--brd);margin:0 16px 12px;
  box-shadow:0 2px 8px var(--sh);overflow:hidden;
}
.shop-head{
  display:flex;align-items:center;padding:14px 16px;
  cursor:pointer;user-select:none;gap:10px;
}
.shop-cat-icon{
  font-size:18px;line-height:1;flex-shrink:0;
}
.shop-cat-name{font-weight:700;font-size:15px;flex:1}
.shop-progress{font-size:12px;color:var(--tx3);margin-right:4px}
.shop-arrow{
  font-size:12px;color:var(--tx3);transition:transform .25s;flex-shrink:0;
}
.shop-card.open .shop-arrow{transform:rotate(180deg)}
.shop-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.shop-card.open .shop-body{max-height:1000px}
.shop-body-inner{padding:0 16px 12px}

/* ===== Tips ===== */
.tips-grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip-card{
  background:var(--bg2);border:1px solid var(--brd);
  border-radius:var(--rs);padding:14px;
}
.tip-card h4{
  font-size:15px;font-weight:800;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
  color:var(--tx1);letter-spacing:.5px;
}
.tip-card p{font-size:12px;color:var(--tx2);line-height:1.5}
.tip-card a{color:var(--pri);text-decoration:none}

/* Tip food interactive */
.tip-card.full{grid-column:1/-1}
.fx-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.fx-select,.fx-input{
  padding:8px 10px;border:1px solid var(--brd);border-radius:10px;
  font-size:14px;background:var(--bg2);color:var(--tx1);
}
.fx-select{min-width:100px}
.fx-input{flex:1;min-width:0;font-family:"SF Mono",monospace;font-weight:700}
.cam-btns{display:flex;gap:8px;margin-top:8px}
.cam-btn{
  flex:1;padding:8px;border:1px solid var(--brd);border-radius:10px;
  background:var(--bg2);color:var(--tx1);font-size:13px;font-weight:600;
  cursor:pointer;text-align:center;
}
.cam-btn:active{background:var(--pri);color:#fff}
.cam-text{
  width:100%;padding:8px 10px;border:1px solid var(--brd);border-radius:10px;
  font-size:13px;background:var(--bg2);color:var(--tx1);
  margin-top:8px;min-height:60px;resize:vertical;font-family:inherit;
}
.cam-status{
  font-size:12px;color:var(--tx3);margin-top:4px;
  display:flex;align-items:center;gap:6px;
}
/* Voice translate */
.voice-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;
  background:var(--pri);color:#fff;margin-top:8px;
  transition:all .2s;
}
.voice-btn:active{transform:scale(.97)}
.voice-btn.recording{
  background:var(--danger);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(224,122,95,.4)}
  50%{box-shadow:0 0 0 10px rgba(224,122,95,0)}
}
.voice-text{
  width:100%;padding:8px 10px;border:1px solid var(--brd);border-radius:10px;
  font-size:13px;background:var(--bg2);color:var(--tx1);
  margin-top:8px;min-height:50px;resize:vertical;font-family:inherit;
}
.voice-result{
  margin-top:8px;padding:10px 14px;
  background:var(--pri-l);border-radius:10px;
  font-size:14px;font-weight:600;color:var(--pri);
  display:none;word-break:break-word;
}
.cam-result{
  margin-top:8px;padding:12px 14px;
  background:var(--pri-l);border-radius:10px;
  font-size:14px;font-weight:600;color:var(--pri);
  display:none;word-break:break-word;
  line-height:1.7;
}
.fx-result{
  margin-top:10px;padding:10px 14px;
  background:var(--pri-l);border-radius:10px;
  font-size:15px;font-weight:700;color:var(--pri);
  text-align:center;
}
/* Food city cards */
.food-city-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.food-city-card{
  background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);
  overflow:hidden;
}
.food-city-head{
  display:flex;align-items:center;padding:10px 12px;gap:8px;
  cursor:pointer;user-select:none;
}
.food-city-icon{font-size:12px;flex-shrink:0}
.food-city-name{font-size:14px;font-weight:700;flex:1}
.food-city-count{font-size:12px;color:var(--tx3)}
.food-city-arrow{font-size:12px;color:var(--tx3);transition:transform .25s;flex-shrink:0}
.food-city-card.open .food-city-arrow{transform:rotate(180deg)}
.food-city-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.food-city-card.open .food-city-body{max-height:600px}
.food-city-inner{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px}
.tip-rest-card{
  background:var(--bg3);border-radius:8px;padding:8px 12px;
}
.tip-rest-name{font-size:13px;font-weight:700}
.tip-rest-tag{
  display:inline-block;font-size:10px;font-weight:600;
  padding:1px 5px;border-radius:3px;margin-left:4px;
  background:rgba(129,178,154,.2);color:var(--ok);
}
.tip-rest-meta{font-size:11px;color:var(--tx2);margin-top:2px}

/* ===== Expense ===== */
.exp-wrap{
  background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);
  padding:16px;margin:0 16px 12px;
  box-shadow:0 2px 8px var(--sh);
}
.exp-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;
}
.exp-box{
  background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);
  padding:14px;text-align:center;
}
.exp-box-label{font-size:12px;color:var(--tx3);margin-bottom:4px}
.exp-box-value{font-size:22px;font-weight:800;color:var(--pri);font-family:"SF Mono",monospace}
.exp-box-value.small{font-size:16px}
.exp-cat-list{margin-bottom:16px}
.exp-cat-item{
  display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--brd);
}
.exp-cat-item:last-child{border-bottom:none}
.exp-cat-icon{font-size:18px;flex-shrink:0}
.exp-cat-info{flex:1;min-width:0}
.exp-cat-name{font-size:13px;font-weight:600}
.exp-cat-bar{
  height:6px;border-radius:3px;background:var(--bg3);margin-top:4px;overflow:hidden;
}
.exp-cat-bar-fill{height:100%;border-radius:3px;background:var(--pri);transition:width .3s}
.exp-cat-amount{
  font-size:13px;font-weight:700;color:var(--tx1);flex-shrink:0;text-align:right;min-width:60px;
}
.exp-cat-pct{font-size:11px;color:var(--tx3);text-align:right}
.exp-form{
  background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);
  padding:14px;margin-bottom:16px;display:none;
}
.exp-form.show{display:block}
.exp-form-row{display:flex;gap:8px;margin-bottom:8px}
.exp-input{
  flex:1;padding:8px 10px;border:1px solid var(--brd);border-radius:8px;
  font-size:14px;background:var(--bg2);color:var(--tx1);font-family:inherit;
}
.exp-select{
  padding:8px 10px;border:1px solid var(--brd);border-radius:8px;
  font-size:13px;background:var(--bg2);color:var(--tx1);min-width:80px;
}
.exp-people{display:flex;gap:6px;margin-bottom:8px}
.exp-people-label{font-size:12px;color:var(--tx3);margin-bottom:4px}
.exp-person-btn{
  flex:1;padding:6px 4px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;border:2px solid var(--brd);
  background:var(--bg3);color:var(--tx2);text-align:center;transition:all .15s;
}
.exp-person-btn.active{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.exp-add-btn{
  width:100%;padding:10px;border:none;border-radius:10px;
  background:var(--pri);color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;margin-top:4px;
}
.exp-add-btn:active{opacity:.8}
.exp-toggle-btn{
  width:100%;padding:12px;border:2px dashed var(--brd);border-radius:10px;
  background:transparent;color:var(--tx2);font-size:14px;font-weight:600;
  cursor:pointer;margin-bottom:16px;
}
.exp-list-item{
  display:flex;align-items:center;gap:8px;padding:10px 0;
  border-bottom:1px solid var(--brd);
}
.exp-list-item:last-child{border-bottom:none}
.exp-list-icon{font-size:16px;flex-shrink:0}
.exp-list-info{flex:1;min-width:0}
.exp-list-note{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-list-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.exp-list-amount{font-size:15px;font-weight:700;color:var(--pri);flex-shrink:0}
.exp-list-del{
  width:24px;height:24px;border-radius:50%;border:none;
  background:var(--bg3);color:var(--tx3);font-size:14px;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.exp-split{
  background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rs);
  padding:14px;margin-top:16px;
}
.exp-split-title{font-size:14px;font-weight:700;margin-bottom:8px}
.exp-split-item{
  display:flex;justify-content:space-between;padding:4px 0;font-size:13px;
}
.exp-split-pay{color:var(--tx2)}
.exp-split-amount{font-weight:600}
.exp-split-amount.plus{color:var(--ok)}
.exp-split-amount.minus{color:var(--danger)}

/* ===== Back to Top ===== */
.back-top{
  position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:101;
  width:44px;height:44px;border-radius:50%;
  background:var(--pri);color:#fff;border:none;
  font-size:20px;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
}
.back-top.show{opacity:1;visibility:visible}
.back-top:active{transform:scale(.9)}

/* ===== Footer ===== */
.footer{
  text-align:center;padding:30px 16px;
  padding-bottom:calc(30px + 70px + env(safe-area-inset-bottom));
  font-size:12px;color:var(--tx3);
  background:transparent;
}

/* ===== Responsive ===== */
@media(max-width:380px){
  .cd-num{font-size:28px;padding:6px 8px}
  .flight-time{font-size:22px}
  .tips-grid{grid-template-columns:1fr}
}
@media(min-width:768px){
  .container{padding:0 24px}
  .hero{padding:36px 28px 28px}
}

/* ===== Print ===== */
@media print{
  .hero{background:#3D405B!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .day-body{max-height:none!important}
  .countdown{display:none}
}

  toUTC(y,mo,d,h,mi,code) {
    const o = this.off[code]||0;
    return Date.UTC(y,mo-1,d,h-o,mi);

/* ============================
   RENDER: BOOKING
   ============================ */
function flightCard(f) {
  const fromLabel = UT.label[f.from]||f.from;
  const toLabel = UT.label[f.to]||f.to;
  const depTime = (f.dh||f.dmi) ? UT.fmt(f.dh,f.dmi) : '待定';
  const arrTime = (f.ah||f.ami) ? UT.fmt(f.ah,f.ami) : '待定';
  const crossDay = f.ad > f.dd || f.am > f.dm;
  const tzFrom = UT.tzName[f.from]||'';
  const tzTo = UT.tzName[f.to]||'';
  return '<div class="card flight">' +
    '<div class="flight-head">' +
    '<span class="flight-no">' + (f.air||'待定') + ' ' + (f.no||'待定') + '</span>' +
    '<span class="flight-tag ' + (f.ok?'tag-ok':'tag-tbd') + '">' + (f.ok?'已出票':'待确认') + '</span>' +
    '</div>' +
    '<div class="flight-route">' +
    '<div class="flight-city left"><div class="flight-time">' + depTime + '</div><div class="flight-code">' + fromLabel + ' ' + f.from + '</div><div class="flight-date">' + UT.fmtDate(f.dy,f.dm,f.dd) + ' ' + tzFrom + '</div></div>' +
    '<div class="flight-mid"><div class="flight-dur">' + (crossDay?'+1天':'') + '</div><div class="flight-line"></div></div>' +
    '<div class="flight-city right"><div class="flight-time">' + arrTime + '</div><div class="flight-code">' + toLabel + ' ' + f.to + '</div><div class="flight-date">' + (crossDay?UT.fmtDate(f.ay,f.am,f.ad)+' ':' ') + tzTo + '</div></div>' +
    '</div>' +
    (f.note ? '<div class="flight-note">' + (f.grp2?'👥 小何 小季 · ':'') + f.note + '</div>' : (f.grp2?'<div class="flight-note">👥 小何 小季</div>':'')) +
    '</div>';
}

/* ============================
   COUNTDOWN & HERO
   ============================ */
function getAllEvents() {
  const evs = [];
  flights.forEach(f => {
    if (f.dh === 0 && f.dmi === 0 && !f.ok) return;
    const depUTC = UT.toUTC(f.dy,f.dm,f.dd,f.dh,f.dmi,f.from);
    evs.push({ utc:depUTC, type:'dep', label:(f.grp2?'👥 ':'')+(f.air+' '+f.no), detail:UT.label[f.from]+' → '+UT.label[f.to], tz:f.from, sub:f.note });
    if (f.ah !== 0 || f.ami !== 0) {
      const arrUTC = UT.toUTC(f.ay,f.am,f.ad,f.ah,f.ami,f.to);
      evs.push({ utc:arrUTC, type:'arr', label:(f.grp2?'👥 ':'')+'到达 '+UT.label[f.to], detail:f.air+' '+f.no, tz:f.to });
    }
  });
  evs.push({ utc:UT.toUTC(2026,10,1,8,0,'CUZ'), type:'act', label:'🏛️ 马丘比丘入场', detail:'Circuito 1 Ruta 1-B', tz:'CUZ' });
  evs.sort((a,b)=>a.utc-b.utc);
  return evs;
}

const allEvents = getAllEvents();

function tickCountdown() {
  const now = Date.now();
  let next = allEvents.find(e => e.utc > now);
  if (!next) next = allEvents[allEvents.length-1];

  document.getElementById('heroTitle').textContent = next.label;
  document.getElementById('heroDetail').textContent = next.detail;
  document.getElementById('heroTz').textContent = (next.tz ? UT.tzName[next.tz]+' · ' : '') + '北京时间倒计时';

  let diff = Math.max(0, next.utc - now);
  const d = Math.floor(diff/864e5); diff %= 864e5;
  const h = Math.floor(diff/36e5); diff %= 36e5;
  const m = Math.floor(diff/6e4); diff %= 6e4;
  const s = Math.floor(diff/1e3);
  document.getElementById('cdD').textContent = d;
  document.getElementById('cdH').textContent = String(h).padStart(2,'0');
  document.getElementById('cdM').textContent = String(m).padStart(2,'0');
  document.getElementById('cdS').textContent = String(s).padStart(2,'0');
}

function renderBooking() {
  var statusBadge = function(ok) {
    return ok
      ? '<span style="float:right;font-size:11px;font-weight:700;color:var(--ok);background:rgba(129,178,154,.12);padding:2px 8px;border-radius:6px">已确认</span>'
      : '<span style="float:right;font-size:11px;font-weight:700;color:#C89630;background:rgba(242,204,143,.15);padding:2px 8px;border-radius:6px">未预定</span>';
  };
  var cats = [
    { key:'flights', icon:'✈️', label:'机票',
      confirmed: flights.filter(function(f){return f.ok}),
      unbooked: flights.filter(function(f){return !f.ok}),
      renderItem: function(f, ok) { return flightCard(f); } },
    { key:'trains', icon:'🚂', label:'火车',
      confirmed: trains.filter(function(t){return t.ok}),
      unbooked: trains.filter(function(t){return !t.ok}),
      renderItem: function(t, ok) {
        return '<div class="card info-card" ><div class="ic-title">' + t.route + ' ' + statusBadge(ok) + '</div><div class="ic-sub">' + t.date + ' · ' + t.company + '</div></div>';
      } },
    { key:'hotels', icon:'🏨', label:'酒店',
      confirmed: hotels.filter(function(h){return h.name !== null}),
      unbooked: hotels.filter(function(h){return h.name === null}),
      renderItem: function(h, ok) {
        return '<div class="card info-card" ><div class="ic-title">' + h.city + ' <span style="font-weight:400;font-size:12px;color:var(--tx3)">' + h.date + '</span> ' + statusBadge(ok) + '</div><div class="ic-empty">' + (h.name || '待预订') + '</div></div>';
      } },
    { key:'tickets', icon:'🎫', label:'门票',
      confirmed: tickets.filter(function(t){return t.ok}),
      unbooked: tickets.filter(function(t){return !t.ok}),
      renderItem: function(t, ok) {
        return '<div class="card info-card" ><div class="ic-title">' + t.name + ' ' + statusBadge(ok) + '</div><div class="ic-sub">' + t.date + ' ' + t.time + ' · ' + t.detail + '</div></div>';
      } },
  ];
  var tabsEl = document.getElementById('bookingTabs');
  var panelsEl = document.getElementById('bookingPanels');
  if (!tabsEl || !panelsEl) return;
  tabsEl.innerHTML = cats.map(function(c, i) {
    var total = c.confirmed.length + c.unbooked.length;
    var active = c.key === currentBookingCat ? ' active' : '';
    return '<button class="tab' + active + '" data-cat="' + c.key + '">' + c.icon + ' ' + c.label + ' ' + total + '</button>';
  }).join('');
  var cat = cats.find(function(c){return c.key === currentBookingCat}) || cats[0];
  var panelHtml = '';
  if (cat.confirmed.length > 0) panelHtml += cat.confirmed.map(function(item){return cat.renderItem(item, true)}).join('');
  if (cat.unbooked.length > 0) panelHtml += cat.unbooked.map(function(item){return cat.renderItem(item, false)}).join('');
  if (!panelHtml) panelHtml = '<div style="padding:20px 16px;text-align:center;color:var(--tx3)">暂无数据</div>';
  panelsEl.innerHTML = panelHtml;
  tabsEl.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      currentBookingCat = tab.dataset.cat;
      renderBooking();
    });
  });
}

  'AEP': {lat:-34.5592, lng:-58.4157},

  'MVD': {lat:-34.4710, lng:-57.8394},
  'GIG': {lat:-22.9068, lng:-43.1729},
};
function gmapURI(code) {
  const name = UT.label[code] || code;
  const g = GEO[code];
  if (g) return 'https://www.google.com/maps/search/?api=1&query=' + g.lat + ',' + g.lng;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name);
}

/* ============================
   RENDER: ITINERARY
   ============================ */
function renderItinerary() {
  const el = document.getElementById('itinerary');
  el.innerHTML = days.map((day, idx) => {
    const timeline = day.ev.map(e => {
      const dotClass = e.type==='hotel'?'hotel':(e.type==='arr'?'done':'');
      const badgeClass = e.badge==='门票'?'badge-ticket':e.badge==='汇合'?'badge-group':'badge-book';
      const badgeHTML = e.badge ? (e.bookUrl
        ? '<a class="tl-badge ' + badgeClass + '" href="' + e.bookUrl + '" target="_blank" rel="noopener" style="text-decoration:none">' + e.badge + ' ↗</a>'
        : '<span class="tl-badge ' + badgeClass + '">' + e.badge + '</span>') : '';
      const locName = UT.label[e.c] || '';
      const navLink = e.c && locName ? ' <a class="loc-link" href="' + gmapURI(e.c) + '" target="_blank" rel="noopener">📍</a>' : '';
      return '<div class="tl-item">' +
        '<div class="tl-time">' + (e.t||'') + '</div>' +
        '<div class="tl-dot ' + dotClass + '"></div>' +
        '<div class="tl-content">' + e.txt + badgeHTML + navLink + (e.sub?'<div class="tl-sub">'+e.sub+'</div>':'') + '</div>' +
        '</div>';
    }).join('');

    const summaryEvs = day.ev.filter(e => e.t && e.type !== 'hotel' && e.type !== 'info').slice(0, 4);
    const summaryText = summaryEvs.map(e => e.txt).join(' → ');

    const navPoints = day.ev.filter(e=>e.c && UT.label[e.c]).map(e=>e.c);
    const uniqueNav = [...new Set(navPoints)];
    const navBtns = uniqueNav.map(n=>'<a class="nav-btn" href="' + gmapURI(n) + '" target="_blank" rel="noopener">📍 ' + UT.label[n] + '</a>').join('');

    return '<div class="day-card' + (idx===0?' open':'') + '">' +
      '<div class="day-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
      '<span class="day-num">D' + day.n + '</span>' +
      '<span class="day-date">' + day.date + '</span>' +
      '<span class="day-arrow">▾</span>' +
      '</div>' +
      (summaryText ? '<div class="day-summary"><div class="day-summary-text">' + summaryText + '</div></div>' : '') +
      '<div class="day-body"><div class="day-inner">' +
      '<div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--tx2)">' + day.title + ' <span style="font-weight:400;font-size:12px;color:var(--tx3)">· ' + day.loc + '</span></div>' +
      '<div class="tl">' + timeline + '</div>' +
      (navBtns?'<div class="day-nav">' + navBtns + '</div>':'') +
      '</div></div></div>';
  }).join('');
}

function renderTodos() {

  const urgOrder = { urgent: 0, normal: 1, low: 2 };
  const sorted = [...todos].sort((a, b) => (urgOrder[a.urg] || 1) - (urgOrder[b.urg] || 1));

    `<div class="todo-item">

      <span style="flex:1">${t.txt}</span>

  ).join('');
}

function renderTopTodos() {
  const urgOrder = { urgent: 0, normal: 1, low: 2 };

    `<div class="hero-todo-item">
      <span class="hero-todo-dot ${t.urg}"></span>
      <span class="hero-todo-text">${t.txt}</span>

  ).join('');

  document.getElementById('heroTodo').innerHTML =
    `<div class="hero-todo-title">📋 当前待办 TOP 3</div>
    <div class="hero-todo-list">${items}</div>

const SHOP_KEY = 'sa_trip_shop_2026';
function loadShopState() {
  try { return JSON.parse(localStorage.getItem(SHOP_KEY)) || {}; } catch { return {}; }
}
function saveShopState(state) {
  try { localStorage.setItem(SHOP_KEY, JSON.stringify(state)); } catch {}
}

function renderShopping() {
  const el = document.getElementById('shopCards');
  const state = loadShopState();

  // Group shops by category
  const catData = {};
  shops.forEach((s, i) => {
    if (!catData[s.cat]) catData[s.cat] = { total: 0, done: 0, items: [] };
    catData[s.cat].total++;
    if (state[i]) catData[s.cat].done++;
    catData[s.cat].items.push({ ...s, idx: i });
  });

  el.innerHTML = Object.entries(catData).map(([cat, data]) => {
    const items = data.items.map(item => {
      const checked = state[item.idx] ? 'checked' : '';
      return `<div class="shop-item ${checked}" data-idx="${item.idx}" onclick="toggleShop(this)">
        <span class="shop-name">${item.name}</span>
        <span class="shop-check">✓</span>
      </div>`;
    }).join('');

    const catIcons = {'证件':'📄','电子':'🔌','药品':'💊','衣物':'👕','防护':'🧴','日用':'🧳','安全':'🔒','其他':'📦'};
    return `<div class="shop-card">
      <div class="shop-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="shop-cat-icon">${catIcons[cat] || '📦'}</span>
        <span class="shop-cat-name">${cat}</span>
        <span class="shop-progress">${data.done}/${data.total}</span>
        <span class="shop-arrow">▾</span>
      </div>
      <div class="shop-body">
        <div class="shop-body-inner">${items}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleShop(el) {
  const idx = el.dataset.idx;
  const state = loadShopState();
  state[idx] = !state[idx];
  saveShopState(state);
  el.classList.toggle('checked');
  // Update progress text in the card header
  const card = el.closest('.shop-card');
  const items = card.querySelectorAll('.shop-item');
  const done = card.querySelectorAll('.shop-item.checked').length;
  card.querySelector('.shop-progress').textContent = done + '/' + items.length;
}

function loadCustomShops() {
  try { return JSON.parse(localStorage.getItem('sa_trip_custom_shop')) || []; } catch { return []; }
}
function saveCustomShops(list) {
  try { localStorage.setItem('sa_trip_custom_shop', JSON.stringify(list)); } catch {}
}

function addCustomShop() {
  const cat = document.getElementById('addShopCat').value;
  const name = document.getElementById('addShopName').value.trim();
  if (!name) return;
  const custom = loadCustomShops();
  custom.push({ cat, name });
  saveCustomShops(custom);
  document.getElementById('addShopName').value = '';
  // Update shops array and re-render
  shops.push({ cat, name });
  renderShopping();
  // Update counter in tip header
  const state = loadShopState();
  const done = shops.filter((s,i) => state[i]).length;
  const h4 = document.querySelector('#shopTipCard h4 span');
  if (h4) h4.textContent = done + '/' + shops.length + ' ▾';
}

function openLens() {
  // Try to open Google Lens directly on mobile
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad/i.test(navigator.userAgent);
  if (isAndroid) {
    // Android: open Google app with lens intent
    window.open('google://lens', '_blank');
    setTimeout(() => {
      window.open('https://lens.google.com/', '_blank');
    }, 1500);
  } else if (isIOS) {
    // iOS: open Google app
    window.open('googleapp://lens', '_blank');
    setTimeout(() => {
      window.open('https://lens.google.com/', '_blank');
    }, 1500);
  } else {
    // Desktop fallback
    window.open('https://lens.google.com/', '_blank');
  }
}

function copyCamText() {
  const text = document.getElementById('camText').value || document.getElementById('camResult').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const result = document.getElementById('camResult');
    result.textContent = '✅ 已复制到剪贴板';
    result.style.display = 'block';
    setTimeout(() => { result.style.display = 'none'; }, 2000);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const result = document.getElementById('camResult');
    result.textContent = '✅ 已复制到剪贴板';
    result.style.display = 'block';
    setTimeout(() => { result.style.display = 'none'; }, 2000);
  });
}

function getTranslateURL(text, srcLang, tgtLang) {
  const isChina = (new Date().getTimezoneOffset() / -60) === 8;
  if (isChina) {
    return 'https://fanyi.youdao.com/#/translate?i=' + encodeURIComponent(text) + '&from=' + srcLang + '&to=' + tgtLang;
  }
  return 'https://translate.google.com/?sl=' + srcLang + '&tl=' + tgtLang + '&text=' + encodeURIComponent(text) + '&op=translate';
}

function doCamTranslate() {
  const text = document.getElementById('camText').value.trim();
  const lang = document.getElementById('camLang').value;
  const result = document.getElementById('camResult');
  if (!text) { result.textContent = '请先输入要翻译的文字'; result.style.display = 'block'; return; }
  result.textContent = '翻译中...';
  result.style.display = 'block';
  const [srcLang, tgtLang] = lang.split('|');
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.substring(0, 450)) + '&langpair=' + srcLang + '|' + tgtLang + '&de=travelhandbook2026@gmail.com';
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.responseData && data.responseData.translatedText && data.responseStatus === 200) {
        result.innerHTML = data.responseData.translatedText;
      } else {
        const fUrl = getTranslateURL(text, srcLang, tgtLang);
        const isChina = (new Date().getTimezoneOffset() / -60) === 8;
        result.innerHTML = 'API 额度已用完，<a href="' + fUrl + '" target="_blank" style="color:var(--pri);font-weight:700">点击用' + (isChina ? '有道翻译' : 'Google 翻译') + ' →</a>';
      }
    })
    .catch(() => {
      const fUrl = getTranslateURL(text, srcLang, tgtLang);
      const isChina = (new Date().getTimezoneOffset() / -60) === 8;
      result.innerHTML = '网络错误，<a href="' + fUrl + '" target="_blank" style="color:var(--pri);font-weight:700">点击用' + (isChina ? '有道翻译' : 'Google 翻译') + ' →</a>';
    });
}

  const langPair = document.getElementById('voiceLang').value;
  const srcLang = langPair.split('|')[0];
  const langMap = { 'zh-CN':'zh-CN', 'es':'es-ES', 'pt':'pt-BR', 'en':'en-US' };

  if (voiceRecording) {
    voiceRecognition.stop();
    voiceRecording = false;
    btn.classList.remove('recording');
    btn.innerHTML = '🎙️ 点击开始说话';
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('当前浏览器不支持语音识别，请使用 Chrome 或 Safari');
    return;
  }

  voiceRecognition = new SpeechRecognition();
  voiceRecognition.lang = langMap[srcLang] || 'en-US';
  voiceRecognition.interimResults = true;
  voiceRecognition.continuous = true;

  const textArea = document.getElementById('voiceText');
  textArea.value = '';

  voiceRecognition.onresult = (event) => {
    let text = '';
    for (let i = 0; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    textArea.value = text;
  };

  voiceRecognition.onend = () => {
    voiceRecording = false;
    btn.classList.remove('recording');
    btn.innerHTML = '🎙️ 点击开始说话';
    // Auto translate when speech ends
    const text = textArea.value.trim();
    if (text) doVoiceTranslate();
  };

  voiceRecognition.onerror = (e) => {
    if (e.error !== 'aborted') {
      textArea.value = '识别出错: ' + e.error;
    }
    voiceRecording = false;
    btn.classList.remove('recording');
    btn.innerHTML = '🎙️ 点击开始说话';
  };

  voiceRecognition.start();
  voiceRecording = true;
  btn.classList.add('recording');
  btn.innerHTML = '🔴 正在录音... 点击停止';
}

function doVoiceTranslate() {
  const text = document.getElementById('voiceText').value.trim();
  const lang = document.getElementById('voiceLang').value;
  const result = document.getElementById('voiceResult');
  if (!text) return;
  result.textContent = '翻译中...';
  result.style.display = 'block';
  const [srcLang, tgtLang] = lang.split('|');
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + srcLang + '|' + tgtLang + '&de=travelhandbook2026@gmail.com';
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.responseData && data.responseData.translatedText && data.responseStatus === 200) {
        result.innerHTML = data.responseData.translatedText;
      } else {
        const fUrl = getTranslateURL(text, srcLang, tgtLang);
        const isChina = (new Date().getTimezoneOffset() / -60) === 8;
        result.innerHTML = 'API 额度已用完，<a href="' + fUrl + '" target="_blank" style="color:var(--pri);font-weight:700">点击用' + (isChina ? '有道翻译' : 'Google 翻译') + ' →</a>';
      }
    })
    .catch(() => {
      const fUrl = getTranslateURL(text, srcLang, tgtLang);
      const isChina = (new Date().getTimezoneOffset() / -60) === 8;
      result.innerHTML = '网络错误，<a href="' + fUrl + '" target="_blank" style="color:var(--pri);font-weight:700">点击用' + (isChina ? '有道翻译' : 'Google 翻译') + ' →</a>';
    });
}

const FX_RATES = { SOL:1.95, BRL:1.30, CLP:0.0071, ARS:0.0045, UYU:0.17, USD:7.25, CNY:1 };
const FX_LABELS = {
  CNY:'¥ 人民币', SOL:'S/. 索尔', BRL:'R$ 雷亚尔',
  CLP:'$ 智利比索', ARS:'$ 阿根廷比索', UYU:'$U 乌拉圭', USD:'$ 美元'
};

function fetchFxRates() {
  fetch('https://open.er-api.com/v6/latest/CNY')
    .then(r => r.json())
    .then(data => {
      if (data.result === 'success' && data.rates) {
        if (data.rates.PEN) FX_RATES.SOL = 1 / data.rates.PEN;
        if (data.rates.BRL) FX_RATES.BRL = 1 / data.rates.BRL;
        if (data.rates.CLP) FX_RATES.CLP = 1 / data.rates.CLP;
        if (data.rates.ARS) FX_RATES.ARS = 1 / data.rates.ARS;
        if (data.rates.UYU) FX_RATES.UYU = 1 / data.rates.UYU;
        if (data.rates.USD) FX_RATES.USD = 1 / data.rates.USD;
        updateCurrencySelects();
      }
    })
    .catch(() => console.log('Using fallback exchange rates'));
}

function updateCurrencySelects() {
  const options = Object.entries(FX_LABELS).map(([code, label]) =>
    '<option value="' + code + '|' + FX_RATES[code] + '">' + label + '</option>'
  ).join('');
  const expSel = document.getElementById('expCurrency');
  if (expSel) expSel.innerHTML = options;
}

function doConvert() {
  const sel = document.getElementById('fxCurrency').value;
  const [curCode] = sel.split('|');
  const rate = FX_RATES[curCode] || parseFloat(sel.split('|')[1]);
  const amount = parseFloat(document.getElementById('fxAmount').value);
  const result = document.getElementById('fxResult');
  if (isNaN(amount) || amount <= 0) {
    result.textContent = '输入金额自动换算人民币';
    return;
  }
  const rmb = (amount * rate).toFixed(2);
  const currencyName = FX_LABELS[curCode] || curCode;
  result.textContent = amount + ' ' + currencyName + ' ≈ ¥' + rmb + ' 人民币';
}

   EXPENSE TRACKER (localStorage)
   ============================ */
const EXP_KEY = 'sa_trip_expenses';
const EXP_PEOPLE = ['小罗','小刘','小何','小季'];

function loadExpenses() {
  try { return JSON.parse(localStorage.getItem(EXP_KEY)) || []; } catch { return []; }
}
function saveExpenses(list) {
  try { localStorage.setItem(EXP_KEY, JSON.stringify(list)); } catch {}
}

function toggleExpForm() {
  document.getElementById('expForm').classList.toggle('show');
}

function toggleExpPerson(btn) {
  btn.classList.toggle('active');
}

function getSplitPeople() {
  return Array.from(document.querySelectorAll('#expPeople .exp-person-btn.active')).map(b => b.dataset.name);
}

function addExpense() {
  const amount = parseFloat(document.getElementById('expAmount').value);
  const catVal = document.getElementById('expCategory').value;
  const curVal = document.getElementById('expCurrency').value;
  const payer = document.getElementById('expPayer').value;
  const note = document.getElementById('expNote').value.trim();
  const splitAmong = getSplitPeople();
  if (isNaN(amount) || amount <= 0) return;
  if (splitAmong.length === 0) { alert('请至少选择一个分摊人员'); return; }
  const [icon, catName] = catVal.split('|');
  const [curCode, rate] = curVal.split('|');
  const rmb = amount * parseFloat(rate);
  const record = {
    amount, rmb, currency: curCode, rate: parseFloat(rate),
    category: catName, icon, payer, note,
    split_among: splitAmong,
    date: new Date().toISOString().slice(0, 10)
  };
  // Always save to localStorage as backup
  const list = loadExpenses();
  list.unshift({...record, id: Date.now()});
  saveExpenses(list);
  // Also save to Supabase if available
  if (_sb) {
    _sb.from('expenses').insert(record).then(() => sbFetchExpenses());
  }
  document.getElementById('expAmount').value = '';
  document.getElementById('expNote').value = '';
  document.querySelectorAll('#expPeople .exp-person-btn').forEach(b => b.classList.add('active'));
  document.getElementById('expForm').classList.remove('show');
  renderExpenses();
}

function deleteExpense(id) {
  const list = loadExpenses().filter(e => e.id !== id);
  saveExpenses(list);
  if (_sb) {
    _sb.from('expenses').delete().eq('id', id).then(() => sbFetchExpenses());
  }
  renderExpenses();
}

const CUR_SYMBOL = {'CNY':'¥','SOL':'S/.','BRL':'R$','CLP':'$','ARS':'$','UYU':'$U','USD':'$'};

function getRmb(e) {
  return e.rmb !== undefined ? e.rmb : e.amount;
}

function renderExpenses() {
  const list = _sbExpenses !== null ? _sbExpenses : loadExpenses();
  const total = list.reduce((s, e) => s + getRmb(e), 0);
  const perPerson = EXP_PEOPLE.length > 0 ? (total / EXP_PEOPLE.length) : 0;

  document.getElementById('expTotal').textContent = total > 0 ? '共 ¥' + total.toFixed(0) : '';

  document.getElementById('expSummary').innerHTML =
    '<div class="exp-box"><div class="exp-box-label">总花费（人民币）</div><div class="exp-box-value">¥' + total.toFixed(2) + '</div></div>' +
    '<div class="exp-box"><div class="exp-box-label">人均</div><div class="exp-box-value small">¥' + perPerson.toFixed(2) + '</div></div>';

  const catMap = {};
  list.forEach(e => {
    if (!catMap[e.category]) catMap[e.category] = { icon: e.icon, amount: 0 };
    catMap[e.category].amount += getRmb(e);
  });
  const catEntries = Object.entries(catMap).sort((a, b) => b[1].amount - a[1].amount);
  const maxCat = catEntries.length > 0 ? catEntries[0][1].amount : 1;

  document.getElementById('expCatList').innerHTML = catEntries.map(([name, data]) => {
    const pct = total > 0 ? (data.amount / total * 100).toFixed(1) : 0;
    const barW = maxCat > 0 ? (data.amount / maxCat * 100) : 0;
    return '<div class="exp-cat-item">' +
      '<span class="exp-cat-icon">' + data.icon + '</span>' +
      '<div class="exp-cat-info"><div class="exp-cat-name">' + name + '</div>' +
      '<div class="exp-cat-bar"><div class="exp-cat-bar-fill" style="width:' + barW + '%"></div></div></div>' +
      '<div><div class="exp-cat-amount">¥' + data.amount.toFixed(0) + '</div>' +
      '<div class="exp-cat-pct">' + pct + '%</div></div></div>';
  }).join('');

  document.getElementById('expList').innerHTML = list.length === 0
    ? '<div style="text-align:center;color:var(--tx3);padding:20px;font-size:13px">还没有消费记录，点击"记一笔"开始</div>'
    : list.map(e => {
      const sym = CUR_SYMBOL[e.currency] || '¥';
      const origAmount = e.currency && e.currency !== 'CNY'
        ? sym + e.amount.toFixed(0) + ' ≈ '
        : '';
      return '<div class="exp-list-item">' +
        '<span class="exp-list-icon">' + (e.icon || '📦') + '</span>' +
        '<div class="exp-list-info"><div class="exp-list-note">' + (e.note || e.category) + '</div>' +
        '<div class="exp-list-meta">' + e.payer + ' · ' + e.date + (e.split_among ? ' · ' + (Array.isArray(e.split_among) ? e.split_among : []).join('') : '') + '</div></div>' +
        '<div style="text-align:right;flex-shrink:0"><div class="exp-list-amount">¥' + getRmb(e).toFixed(0) + '</div>' +
        (origAmount ? '<div style="font-size:11px;color:var(--tx3)">' + origAmount + '</div>' : '') +
        '</div>' +
        '<button class="exp-list-del" onclick="deleteExpense(' + e.id + ')">×</button></div>';
    }).join('');

  // Split calculation
  const paidBy = {};
  const owedBy = {};
  EXP_PEOPLE.forEach(p => { paidBy[p] = 0; owedBy[p] = 0; });
  list.forEach(e => {
    const rmb = getRmb(e);
    if (paidBy[e.payer] !== undefined) paidBy[e.payer] += rmb;
    const split = e.split_among || EXP_PEOPLE;
    const splitArr = Array.isArray(split) ? split : EXP_PEOPLE;
    const share = rmb / splitArr.length;
    splitArr.forEach(p => { if (owedBy[p] !== undefined) owedBy[p] += share; });
  });

  document.getElementById('expSplit').innerHTML =
    '<div class="exp-split-title">AA 分账</div>' +
    EXP_PEOPLE.map(p => {
      const diff = paidBy[p] - owedBy[p];
      const cls = diff > 0.01 ? 'plus' : (diff < -0.01 ? 'minus' : '');
      const label = diff > 0.01 ? '应收' : (diff < -0.01 ? '应付' : '已清');
      return '<div class="exp-split-item"><span class="exp-split-pay">' + p + '（付 ¥' + paidBy[p].toFixed(0) + ' / 摊 ¥' + owedBy[p].toFixed(0) + '）</span>' +
        '<span class="exp-split-amount ' + cls + '">' + (Math.abs(diff) > 0.01 ? (diff > 0 ? '+' : '') + '¥' + diff.toFixed(0) + ' ' + label : '✓ 已清') + '</span></div>';
    }).join('');
}

function initSupabase() {
  try {
    if (!window.supabase) return;
    _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    sbFetchExpenses();
    _sb.channel('all').on(
      'postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, () => sbFetchExpenses()
    ).subscribe();
    // Polling fallback: 每10秒拉一次最新数据（国内 WebSocket 不稳定）
    setInterval(sbFetchExpenses, 10000);
  } catch(e) {
    console.error('Supabase error:', e);
    _sb = null;
  }
}

async function sbFetchExpenses() {
  if (!_sb) return;
  try {
    const { data, error } = await _sb.from('expenses').select('*').order('created_at', { ascending: false });
    if (!error && data) {
      const newLen = data.length;
      const oldLen = _sbExpenses ? _sbExpenses.length : -1;
      // Only re-render if data count changed (avoid unnecessary DOM updates)
      if (newLen !== oldLen || (_sbExpenses && JSON.stringify(data[0]?.id) !== JSON.stringify(_sbExpenses[0]?.id))) {
        _sbExpenses = data;
        renderExpenses();
      } else if (_sbExpenses === null) {
        _sbExpenses = data;
        renderExpenses();
      }
    }
  } catch(e) { console.error('Fetch expenses error:', e); }
}
